# ---------------------------------------------------------------
#  Application settings
#  Values can be overridden with environment variables written as
#  LIB_ + KEY in upper case with dots turned into underscores,
#  e.g. LIB_MAIL_PASSWORD, LIB_UPLOAD_DIR
# ---------------------------------------------------------------

# Folder where book covers / student photos are stored (outside the WAR so
# they survive redeploys). Leave empty to use  <user home>/library_uploads
upload.dir=

# Loan rules used to show the DUE DATE and to pre-fill the fine on the return
# page. The admin can still type any fine, exactly like the PHP version.
loan.days=14
fine.per.day=5

# Admin self-registration (admin_reg.php in the PHP version was open to
# everybody). It is allowed when this is true OR when no admin exists yet.
admin.registration.enabled=false

# Public address of the site, used inside the verification e-mail link
app.base.url=http://localhost:8080/library

# E-mail (verification mail for new students). When mail.enabled=false the
# verification link is written to the Tomcat log and an admin can activate
# the student from  Admin > Students.
mail.enabled=false
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.username=
mail.password=
mail.from=
